[package]
name = "a3s-moe"
version = "0.1.0"
edition = "2021"
authors = ["A3S Lab"]
license = "MIT"
repository = "https://github.com/A3S-Lab/MoE"
description = "Model-owned mixture-of-experts inference for A3S Power"
readme = "README.md"
keywords = ["llm", "moe", "inference", "olmoe"]
categories = ["science"]

[dependencies]
a3s-power = { git = "https://github.com/A3S-Lab/Power.git", rev = "7ce6fa5", default-features = false, features = ["embedded-inference"] }
candle-core = { version = "0.10.2", default-features = false }
candle-nn = { version = "0.10.2", default-features = false }
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
tokenizers = "0.22.2"
tokio-util = "0.7"

[dev-dependencies]
approx = "0.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
