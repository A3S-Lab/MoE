[package]
name = "a3s-moe"
version = "0.1.0"
edition = "2021"
authors = ["A3S Lab"]
license = "MIT"
repository = "https://github.com/A3S-Lab/MoE"
description = "Model-owned mixture-of-experts inference for A3S Power"
readme = "README.md"
keywords = ["llm", "moe", "inference", "olmoe"]
categories = ["science"]

[features]
default = []
validation = ["dep:tokio"]
cuda = ["a3s-power/embedded-cuda"]
metal = ["a3s-power/embedded-metal"]
server = [
    "a3s-power/server",
    "dep:anyhow",
    "dep:async-trait",
    "dep:chrono",
    "dep:clap",
    "dep:futures",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tracing",
    "dep:tracing-subscriber",
]
benchmark = ["server", "dep:libc", "dep:windows-sys"]

[[bin]]
name = "a3s-moe-server"
path = "src/bin/a3s-moe-server.rs"
required-features = ["server"]

[[bin]]
name = "a3s-moe-bench"
path = "src/bin/a3s-moe-bench.rs"
required-features = ["benchmark"]

[[bin]]
name = "a3s-moe-validate"
path = "src/bin/a3s-moe-validate.rs"
required-features = ["validation"]

[dependencies]
a3s-power = { git = "https://github.com/A3S-Lab/Power.git", rev = "42c6646", default-features = false, features = ["embedded-inference"] }
anyhow = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
candle-core = { version = "0.10.2", default-features = false }
candle-nn = { version = "0.10.2", default-features = false }
chrono = { version = "0.4", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
futures = { version = "0.3", optional = true }
libc = { version = "0.2", optional = true }
safetensors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
tokenizers = "0.22.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"], optional = true }
tokio-stream = { version = "0.1", optional = true }
tokio-util = "0.7"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"], optional = true }

[dev-dependencies]
approx = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
